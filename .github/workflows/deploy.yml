name: Deploy Vyasa Sync

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via SCP (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: pro113.dnspro.com.br
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 1157
          source: "dist/*"
          target: vyasa.urbanpages.com.br/
          strip_components: 1
